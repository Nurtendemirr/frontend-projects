<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /> <!-- Karakter seti UTF-8 olarak ayarlanır -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Görüntüleme alanı genişliğini cihaz genişliğine ayarlar ve başlangıç ölçeğini 1 yapar -->
    <title>Color Palette Generator</title> <!-- Sayfa başlığı "Color Palette Generator" olarak belirlenir -->
    <link 
      rel="stylesheet" <!
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" /> <!-- style.css dosyasını sayfaya dahil eder -->
  </head>
  <body>
    <div class="container"> <!-- Ana konteyner div'i -->
      <h1>Color Palette Generator</h1> <!-- Başlık "Color Palette Generator" olarak belirlenir -->

      <button id="generate-btn"> <!-- Renk paleti oluşturmak için bir buton -->
        <i class="fas fa-sync-alt"></i> <!-- Font Awesome simgesi, yenileme simgesi -->
        Generate Palette
      </button>

      <div class="palette-container"> <!-- Renk paletlerini içerecek konteyner -->
        <!-- COLOR BOX 1 -->
        <div class="color-box"> <!-- Her bir renk kutusunu temsil eden div -->
          <div class="color" style="background-color: #e1f5fe"></div> <!-- Renk kutusunun arka plan rengini belirler -->
          <div class="color-info"> <!-- Renk bilgilerini içeren div -->
            <span class="hex-value">#E1F5FE</span> <!-- Renk kodunu gösteren span -->
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i> <!-- Kopyalama simgesi, kopyalama işlemi için kullanılacak -->
          </div>
        </div>
        <!-- COLOR BOX 2 -->
        <div class="color-box">
          <div class="color" style="background-color: #b3e5fc"></div>
          <div class="color-info">
            <span class="hex-value">#B3E5FC</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- COLOR BOX 3 -->
        <div class="color-box">
          <div class="color" style="background-color: #81d4fa"></div>
          <div class="color-info">
            <span class="hex-value">#81D4FA</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- COLOR BOX 4 -->
        <div class="color-box">
          <div class="color" style="background-color: #4fc3f7"></div>
          <div class="color-info">
            <span class="hex-value">#4FC3F7</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- COLOR BOX 5 -->
        <div class="color-box">
          <div class="color" style="background-color: #29b6f6"></div>
          <div class="color-info">
            <span class="hex-value">#29B6F6</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script> <!-- script.js dosyasını sayfaya dahil eder -->
  </body>
</html>
